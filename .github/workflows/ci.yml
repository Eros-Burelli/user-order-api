name: CI
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10


    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: userorderdb
          MYSQL_USER: userorder
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD || format('root-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uuserorder -p${MYSQL_PASSWORD}" --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/userorderdb
      SPRING_DATASOURCE_USERNAME: userorder
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
      JWT_EXPIRATION: 3600000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B clean verify